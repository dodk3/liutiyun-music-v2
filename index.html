/* 皮肤背景盖过播放器内置 ID 级深色底 */
body[data-skin] #np{background:var(--np-bg)!important}
body[data-skin] #npBg{background:var(--np-bg)!important;opacity:1!important;filter:none!important}
body[data-skin] #np .np-inner{background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;color:var(--np-text)}

@keyframes fcSpin{to{transform:rotate(1turn)}}
@keyframes fcFloatUp{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:.85}100%{transform:translateY(-130px) scale(.4);opacity:0}}
@keyframes fcBlob{0%,100%{border-radius:58% 42% 55% 45%/45% 55% 45% 55%}50%{border-radius:42% 58% 45% 55%/55% 45% 55% 45%}}
@keyframes fcGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fcPop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes fcBreathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}

/* 1. 讯息气泡 · iPhone 动态聊天记录 */
body[data-skin=imessage]{--np-bg:#f2f2f7;--np-text:#111114;--np-muted:#6d7278;--np-accent:#0a84ff;--np-accent2:#5ac8fa;--np-card:#ffffff;--np-border:#e5e7ec}

/*$vite$:1*/</style><style>/* ===== 第二轮覆盖：laoshui 式干净登录弹窗 + 高级歌单卡片 + 流畅度 ===== */

/* ---- 登录弹窗容器：单列居中、干净白卡 ---- */
#fc-ncm.on, #fc-qq.on { position: fixed; inset: 0; z-index: 80; }
#fc-ncm .ncm-card, #fc-qq .ncm-card, #fc-qq .qq-card,
.auth-cell .ncm-card, .auth-grid .ncm-card, .auth-cell .qq-card, .auth-grid .qq-card {
  display: flex !important;
  flex-direction: column !important;
  grid-template-columns: none !important;
  grid-template-rows: none !important;
  width: min(400px, 92vw) !important;
  max-width: 400px !important;
  max-height: 92vh;
  margin: auto;
  background: #ffffff !important;
  color: #151a24;
  border: 1px solid #f0f1f5 !important;
  border-radius: 24px !important;
  padding: 8px 22px 22px !important;
  box-shadow: 0 24px 60px rgba(31, 41, 66, .20) !important;
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
  gap: 0;
}

/* 头部：图标圆标 + 标题副标题 + 关闭 */
#fc-ncm .qq-head, #fc-qq .qq-head {
  grid-column: 1/-1;
  align-items: center;
  gap: 12px;
  padding: 22px 0 14px;
  border-bottom: 1px solid #f2f3f7;
}
.qq-head .qq-ic {
  flex: none;
  width: 40px; height: 40px;
  border-radius: 13px;
  background: #eef4ff;
  color: #3a7bd5;
  display: grid; place-items: center;
}
.qq-head .qq-ic svg { width: 22px; height: 22px; }
.qq-head .ncm-h { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.qq-head .ncm-h b { letter-spacing: .2px; font-size: 18px; font-weight: 700; color: #151a24; }
.qq-head .ncm-h small { color: #8a94a8; font-size: 12px; margin-top: 0; }
.qq-head .ncm-x, .qq-head .qq-close {
  margin-left: auto;
  flex: none;
  width: 34px; height: 34px;
  border: 0; border-radius: 11px;
  background: #f3f4f7; color: #7f8aa1;
  font-size: 14px; cursor: pointer;
}
.qq-head .ncm-x:hover { background: #eceef3; color: #43506b; }

/* 平台标签（QQ 扫码 / 微信扫码） */
.qq-tabs {
  order: 2;
  background: #f1f3f8;
  border-radius: 14px;
  gap: 4px; margin: 16px 0 0; padding: 4px;
  display: grid; grid-template-columns: 1fr 1fr;
}
.qq-tab {
  color: #6c778c; border: 0; background: 0 0;
  border-radius: 11px; padding: 9px 0;
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.qq-tab.on { color: #151a24; background: #fff; font-weight: 700; box-shadow: 0 2px 8px rgba(31,41,66,.14); }

/* 二维码灰底圆角框 */
.ncm-qr {
  order: 3;
  place-items: center;
  justify-self: center;
  width: min(210px, 72%) !important;
  aspect-ratio: 1;
  height: auto !important;
  margin: 20px 0 0 !important;
  background: #f2f3f7 !important;
  border: 1px solid #eceef3;
  border-radius: 18px;
  overflow: hidden;
  display: grid;
  box-shadow: 0 10px 30px rgba(31,41,66,.10);
}
.ncm-qr img { width: 78% !important; height: 78% !important; object-fit: contain; image-rendering: auto; }

/* 扫码提示 */
.qq-use, #ncmMsg, #qqMsg {
  order: 4;
  text-align: center;
  color: #6c778c;
  font-size: 13px;
  margin: 16px 0 0;
}

/* 底部说明灰框 */
.qq-box, .ncm-note {
  order: 5;
  text-align: center;
  background: #f6f7fa;
  border-radius: 14px;
  color: #8a94a8;
  font-size: 12px;
  line-height: 1.7;
  padding: 12px 14px;
  margin: 16px 0 0;
}

/* 次级操作与 API 设置：收进低调区域，不破坏参考版式 */
.qq-acts { order: 6; display: flex; gap: 8px; margin-top: 14px; }
.qq-acts button, #ncmGen, #qqGen, #ncmOut, #qqOut {
  flex: 1; border: 1px solid #eceef3; background: #fff; color: #43506b;
  border-radius: 12px; padding: 9px 0; font-size: 12.5px; cursor: pointer;
}
.ncm-cfg.qq-cfg { order: 7; margin-top: 12px; }
.ncm-cfg summary { color: #8a94a8; font-size: 12px; cursor: pointer; }
.ncm-api { display: flex; gap: 8px; margin-top: 8px; }
.ncm-api input {
  flex: 1; min-width: 0; border: 1px solid #eceef3; border-radius: 10px;
  padding: 9px 10px; font-size: 12.5px; background: #fafbfc; color: #151a24;
}

/* ---- 账号歌单：高级封面卡片网格 ---- */
.ncm-lists { order: 8; border-top: 1px solid #f2f3f7; padding-top: 14px; margin-top: 16px; }
.ncm-user { align-items: center; gap: 10px; margin-bottom: 12px; display: flex; }
.ncm-user img { width: 42px; height: 42px; border-radius: 14px; object-fit: cover; }
.ncm-user > div { min-width: 0; flex: 1; }
.ncm-user b { display: block; color: #151a24; font-size: 14px; }
.ncm-user small { color: #8a94a8; font-size: 11.5px; }
.ncm-user button { border: 0; background: #f1f3f8; color: #43506b; border-radius: 10px; padding: 7px 12px; font-size: 12px; cursor: pointer; }

.ncm-pls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 10px;
  max-height: 34vh;
  overflow: auto;
  margin-top: 2px;
}
.ncm-pl {
  align-items: center; gap: 10px;
  background: #fff; border: 1px solid #eceef3; border-radius: 16px;
  padding: 10px; min-width: 0; text-align: left; cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.ncm-pl:hover { transform: translateY(-2px); border-color: #dfe6f3; box-shadow: 0 10px 24px rgba(31,41,66,.10); }
.ncm-pl img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: #eef2f8; flex: none; }
.ncm-pl span { flex-direction: column; gap: 2px; min-width: 0; display: flex; }
.ncm-pl b { color: #151a24; font-size: 12.5px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.ncm-pl small { color: #8a94a8; font-size: 10.5px; }
.ncm-pl em { color: #3a6bd6; flex: none; margin-left: auto; font-size: 10px; font-style: normal; }
@media (max-width: 420px) { .ncm-pls { grid-template-columns: 1fr; } }

/* ===== 搜索页：双列封面大卡片 ===== */
.search-results .sr-sec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:6px}
.search-results .row{flex-direction:column;align-items:stretch;gap:10px;background:#fff;border:1px solid #eceef3;border-radius:18px;padding:12px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.search-results .row:hover{transform:translateY(-3px);border-color:#dfe6f3;box-shadow:0 14px 30px rgba(31,41,66,.10)}
.search-results .row .idx,.search-results .row .dur{display:none}
.search-results .row .cov{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden}
.search-results .row .cov img{width:100%;height:100%;object-fit:cover}
.search-results .r-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.search-results .r-title{font-size:14px;color:#151a24}
.search-results .r-sub{font-size:11.5px;color:#8a94a8}
.search-results .r-right{margin-left:auto;flex-direction:row;gap:4px}
@media (max-width:560px){.search-results .sr-sec{grid-template-columns:1fr}}

/* ===== 3D 黑胶 + 浮动粒子 ===== */
.np-artwrap{perspective:1200px}
.np-art{transform-style:preserve-3d}
body[data-skin=vinyl] .np-art{transform:rotateY(10deg) rotateX(5deg)}
body[data-skin=vinyl] .art-vinyl{transform-style:preserve-3d;box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 30px #000}
body[data-skin=vinyl] .atom{display:block}
body[data-skin=vinyl] .orbit{position:absolute;border:1px solid rgba(255,255,255,.14);border-radius:50%;inset:16%;animation:fcSpin 16s linear infinite}
body[data-skin=vinyl] .elec{width:6px;height:6px;border-radius:50%;background:#ffd28a;box-shadow:0 0 12px rgba(255,210,138,.6);animation:fcFloatUp 7s linear infinite}

/* ===== 顶部：只显示音源，歌曲名留在底部条 ===== */
.np-top .np-src{font-weight:600;letter-spacing:.04em}

/* ---- 流畅度：降低毛玻璃与动画开销 ---- */
.acct-mask { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.ncm-card, .qq-card, .acct-panel { -webkit-backdrop-filter: none; backdrop-filter: none; }
.ncm-pl, .folio-card, .pd-row { will-change: transform; }
.ncm-pls, .pd-list, .folio-row { content-visibility: auto; contain-intrinsic-size: auto 64px; }
img { image-rendering: auto; }
