<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>流体云音乐</title>
<style>
:root{--bg:#0a0b0f;--card:#14161c;--line:rgba(255,255,255,.09);--txt:#f2f4f8;--muted:#8b93a5;--acc:#5b8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
body{overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
.top{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.brand i{color:var(--acc);font-style:normal}
.grow{flex:1}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#cdd4e2;display:grid;place-items:center;font-size:12px;cursor:pointer}
.iconbtn.on{border-color:rgba(91,140,255,.6);color:#fff;background:rgba(91,140,255,.18)}
.search{display:flex;align-items:center;gap:8px;margin:4px 16px 10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--txt);font-size:14px}
.search input::placeholder{color:#5f6779}
.search button{border:0;background:var(--acc);color:#fff;font-size:13px;padding:7px 14px;border-radius:10px;cursor:pointer}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 96px}
.sect{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:13px;color:var(--muted)}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;background:var(--card);cursor:pointer;border:1px solid transparent}
.row:active{background:#191c24}
.cover{width:48px;height:48px;border-radius:12px;flex:none;object-fit:cover;background:#20242e}
.rtxt{min-width:0;flex:1}
.rtxt b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtxt small{display:block;margin-top:3px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdur{font-size:11px;color:#6d7688;flex:none}
.empty{padding:60px 0;text-align:center;color:#6d7688;font-size:13px;line-height:1.9}
.mini{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(12,13,18,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:none;align-items:center;gap:10px}
.mini.show{display:flex}
.mini .cover{width:40px;height:40px;border-radius:10px}
.mini .rtxt b{font-size:13px}
.mini .rtxt small{font-size:11px}
.mini .mbtn{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#e7ebf3;display:grid;place-items:center;cursor:pointer}
.mini .mplay{background:var(--acc);width:38px;height:38px}

/* 全屏播放页 */
.np{position:fixed;inset:0;z-index:50;display:none;background:#0a0b0f;color:#f4f6fa}
.np.open{display:block}
.np-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(46px) saturate(120%);opacity:.4;transform:scale(1.15)}
.np-veil{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(20,26,40,.55),rgba(6,7,10,.94) 62%,#06070a 100%)}
.np-pages{position:relative;height:100%;display:flex;width:200%;transition:transform .32s cubic-bezier(.22,.61,.36,1)}
.np.p2 .np-pages{transform:translateX(-50%)}
.page{position:relative;width:50%;height:100%;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 18px calc(10px + env(safe-area-inset-bottom))}
.np-top{display:flex;align-items:center;gap:8px;height:44px;flex:none}
.pill{font-size:10.5px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#e6ebf5}
.np-top .grow{flex:1}
.chev{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#e9edf6;display:grid;place-items:center;cursor:pointer}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.art{width:min(58vw,250px);aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 22px 60px rgba(0,0,0,.55);background:linear-gradient(135deg,#2a3550,#472a55)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ph{width:100%;height:100%;display:grid;place-items:center;font-size:44px;font-weight:700;color:rgba(255,255,255,.85)}
#npTitle{margin:20px 0 0;font-size:clamp(21px,6.6vw,28px);font-weight:700;text-align:center;line-height:1.3;max-width:100%;word-break:break-word}
#npArtist{margin:9px 0 0;font-size:13px;color:rgba(255,255,255,.55);text-align:center;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap;justify-content:center}
.badges i{font-style:normal;font-size:10.5px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.1);color:#d5dbe6}
.hint{margin:14px 0 0;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:.4px}
.foot{flex:none;display:flex;flex-direction:column;gap:12px}
.seek{position:relative;height:22px;display:flex;align-items:center;cursor:pointer}
.seek .bar{position:relative;height:3px;width:100%;background:rgba(255,255,255,.18);border-radius:3px}
.seek .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:#fff;border-radius:3px}
.seek .knob{position:absolute;top:50%;left:0%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.times{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.5);margin-top:-4px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;align-items:flex-end;gap:10px;padding-top:2px}
.cgroup{flex:1;display:flex;align-items:center;justify-content:center;gap:10px}
.ib{width:42px;height:42px;border:0;background:none;color:#dfe5ef;display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:20px;height:20px;fill:currentColor}
.play{width:66px;height:66px;border-radius:50%;border:0;background:#f4f5f7;color:#111;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.play svg{width:26px;height:26px;fill:currentColor}
.vol{width:30px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:2px}
.vol-track{width:22px;height:72px;border-radius:22px;background:rgba(255,255,255,.14);position:relative;overflow:hidden;cursor:pointer}
.vol-track.vertical{height:72px}
.vfill{position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(180deg,#fff,#dfe5f2)}
.vknob{position:absolute;left:50%;bottom:70%;width:16px;height:16px;margin:0 0 -8px -8px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.vol span{font-size:9.5px;color:rgba(255,255,255,.6)}

/* 第二页 */
.sheet-top{display:flex;align-items:center;gap:12px;flex:none}
.mini-art{width:46px;height:46px;border-radius:12px;overflow:hidden;background:#20242e;flex:none}
.mini-art img{width:100%;height:100%;object-fit:cover}
.sheet-info{min-width:0;flex:1}
.sheet-info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-info small{display:block;margin-top:3px;font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;justify-content:center;gap:0;margin:14px 0 6px;flex:none}
.tabs .t{position:relative;padding:9px 22px;border-radius:999px;font-size:13px;color:rgba(255,255,255,.6);cursor:pointer;background:rgba(255,255,255,.1);display:flex;gap:6px;align-items:center}
.tabs .t.on{background:#fff;color:#111;font-weight:600}
.tabs .t em{font-style:normal;font-size:10px;color:rgba(255,255,255,.5)}
.tabs .t.on em{color:#7d8494}
.body{flex:1;min-height:0;overflow-y:auto;padding:10px 2px 128px;scrollbar-width:none}
.body::-webkit-scrollbar{width:0;height:0}
.lyr{display:flex;flex-direction:column;gap:11px;padding:22px 0;text-align:center}
.lyr b{font-size:15px;color:rgba(255,255,255,.38);font-weight:500;line-height:1.6;transition:color .2s,transform .2s}
.lyr b.on{color:#fff;font-size:18px;transform:scale(1.02)}
.cmt-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.cmt-item img{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:#242936}
.cmt-main{min-width:0}
.cmt-name{font-size:12px;color:#aeb7c9}
.cmt-name em{font-style:normal;color:#6c7486;margin-left:8px;font-size:10.5px}
.cmt-text{font-size:13px;line-height:1.65;margin-top:5px;color:#e8ecf4;word-break:break-word}
.cmt-like{font-size:10.5px;color:#6c7486;margin-top:5px}
.cmt-head{font-size:11px;color:#8b93a5;padding:6px 0 10px}
.sheet-foot{position:absolute;left:0;right:0;bottom:0;padding:18px 18px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,rgba(6,7,10,0) 0%,rgba(6,7,10,.86) 38%,rgba(6,7,10,.98) 100%)}
.sheet-foot .ib{width:44px;height:44px}
.sheet-foot .play{width:56px;height:56px}

/* 登录弹窗 */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(4,5,9,.72);backdrop-filter:blur(8px);padding:20px}
.modal.open{display:flex}
.card{width:min(360px,92vw);max-height:90vh;overflow:auto;background:#12151c;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:18px}
.card header{display:flex;align-items:center;gap:10px}
.card header .h{flex:1}
.card header b{font-size:16px}
.card header small{display:block;font-size:11px;color:#8b93a5;margin-top:4px}
.x{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#cfd6e2;cursor:pointer}
.qr{width:min(200px,62vw);aspect-ratio:1;margin:18px auto 0;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden}
.qr img{width:100%;height:100%;object-fit:contain}
.qr span{font-size:11px;color:#8b93a5;text-align:center;padding:10px}
.status{text-align:center;font-size:12.5px;margin-top:14px;color:#dfe5ef}
.note{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font-size:10.5px;line-height:1.7;color:#8b93a5;text-align:center}
.acts{display:flex;justify-content:center;gap:16px;margin-top:10px}
.acts button{border:0;background:none;color:#8b93a5;font-size:11.5px;text-decoration:underline;cursor:pointer}
.cfg{margin-top:12px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.cfg summary{font-size:11px;color:#8b93a5;cursor:pointer}
.cfg input{width:100%;margin-top:8px;padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0d1016;color:#dfe5ef;font-size:12px}
.cfg .save{margin-top:8px;width:100%;padding:9px;border:0;border-radius:10px;background:rgba(91,140,255,.9);color:#fff;font-size:12px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(20,24,32,.95);border:1px solid rgba(255,255,255,.14);color:#e9edf6;font-size:12px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:80vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">流体云<i>·</i>音乐</div>
    <div class="grow"></div>
    <button class="iconbtn" id="btnNcm" title="网易云登录">云</button>
    <button class="iconbtn" id="btnQq" title="QQ音乐登录">Q</button>
  </div>
  <div class="search">
    <input id="kw" placeholder="搜歌曲、歌手、专辑" autocomplete="off">
    <button id="btnSearch">搜索</button>
  </div>
  <div class="scroll" id="scroll">
    <div id="rsRecent"></div>
    <div id="rsMain"><div class="empty">搜一首歌开始<br><span style="font-size:11px;color:#5b6375">支持网易云音乐与 QQ 音乐</span></div></div>
  </div>
  <div class="mini" id="mini">
    <img class="cover" id="mCover" alt="">
    <div class="rtxt"><b id="mTitle">-</b><small id="mArtist"></small></div>
    <button class="mbtn" id="mPrev"></button>
    <button class="mbtn mplay" id="mPlay">▶</button>
    <button class="mbtn" id="mNext"></button>
  </div>
</div>

<div class="np" id="np">
  <div class="np-bg" id="npBg"></div>
  <div class="np-veil"></div>
  <div class="np-pages">
    <div class="page">
      <div class="np-top">
        <span class="pill" id="npSrc">网易云</span>
        <span class="grow"></span>
        <button class="chev" id="npClose">⌄</button>
      </div>
      <div class="hero">
        <div class="art" id="npArt"></div>
        <h2 id="npTitle">-</h2>
        <p id="npArtist">-</p>
        <div class="badges" id="npBadges"></div>
        <div class="hint" id="npHint">左滑看歌词与评论</div>
      </div>
      <div class="foot">
        <div class="seek" id="seek"><div class="bar"><div class="fill" id="seekFill"></div><div class="knob" id="seekKnob"></div></div></div>
        <div class="times"><span id="tNow">00:00</span><span id="tAll">00:00</span></div>
        <div class="ctrl">
          <div class="cgroup">
            <button class="ib" id="npPrev" aria-label="上一首"></button>
            <button class="play" id="npPlay" aria-label="播放"></button>
            <button class="ib" id="npNext" aria-label="下一首"></button>
          </div>
          <div class="vol">
            <div class="vol-track" id="volTrack"><div class="vfill" id="volFill"></div><div class="vknob" id="volKnob"></div></div>
            <span id="volTxt">70%</span>
          </div>
        </div>
      </div>
    </div>

    <div class="page">
      <div class="np-top">
        <div class="mini-art" id="miniArt"></div>
        <div class="sheet-info"><b id="sTitle">-</b><small id="sArtist">-</small></div>
        <button class="chev" id="npClose2">⌄</button>
      </div>
      <div class="tabs">
        <div class="t on" id="tabLyr">歌词</div>
        <div class="t" id="tabCmt">评论 <em id="cmtCount"></em></div>
      </div>
      <div class="body" id="body">
        <div class="lyr" id="lyr"><b>暂无歌词</b></div>
        <div id="cmt" style="display:none"></div>
      </div>
      <div class="sheet-foot">
        <button class="ib" id="npPrev2"></button>
        <button class="play" id="npPlay2"></button>
        <button class="ib" id="npNext2"></button>
      </div>
    </div>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>

<div class="modal" id="modal">
  <div class="card">
    <header>
      <div class="h"><b id="mTitleTxt">扫码登录</b><small id="mSub">扫描二维码以授权当前账号</small></div>
      <button class="x" id="mClose">✕</button>
    </header>
    <div class="qr" id="qrBox"><span>正在获取二维码…</span></div>
    <div class="status" id="mStatus">请稍候</div>
    <div class="note" id="mNote">登录状态只保存在当前浏览器，仅用于以你本人的账号播放与获取评论。</div>
    <div class="acts">
      <button id="mRefresh">重新生成</button>
      <button id="mOut">退出登录</button>
    </div>
    <details class="cfg">
      <summary>API 地址设置</summary>
      <input id="cfgInput" placeholder="接口地址">
      <button class="save" id="cfgSave">保存并刷新</button>
    </details>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var LS={
  ncm:'fc2_ncm',ncmCk:'fc2_ncm_ck',qq:'fc2_qq',qqCk:'fc2_qq_ck',vol:'fc2_vol',recent:'fc2_recent',src:'fc2_src'
};
var NCM_DEFAULT='https://zm.wwoyun.cn';
var QQ_DEFAULT='https://ep-3z3makzwrcma1w15m8jrvgt0yt.ep.tianacloud.com';
var QQ_TOKEN='tia_1onZvx3yzsDDXNZzVxJdfDSWWdMV86GrLjJkOfG8uiFk';
var S={list:[],idx:-1,page:1,src:'netease',loading:false,tab:'lyr',cmtFor:'',lyr:[],lyrFor:''};

function ls(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function setls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2200)}
function fmt(n){n=Math.max(0,Math.floor(n||0));var m=Math.floor(n/60),s=n%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ncmBase(){return (ls(LS.ncm,NCM_DEFAULT)||NCM_DEFAULT).replace(/\/+$/,'')}
function qqBase(){return (ls(LS.qq,QQ_DEFAULT)||QQ_DEFAULT).replace(/\/+$/,'')}
function ncmCk(){return ls(LS.ncmCk,'')}
function qqCk(){return ls(LS.qqCk,'')}

function fetchJSON(u,opt){
  return fetch(u,Object.assign({cache:'no-store'},opt||{})).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  });
}
function withTimeout(p,ms,label){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){rej(new Error((label||'请求')+'超时'))},ms||12000);
    p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)});
  });
}

/* ---------- 搜索 ---------- */
function searchNcm(kw){
  var ck=ncmCk();
  var u=ncmBase()+'/cloudsearch?keywords='+encodeURIComponent(kw)+'&limit=30&type=1&t='+Date.now()+(ck?'&cookie='+encodeURIComponent(ck):'');
  return withTimeout(fetchJSON(u),14000,'搜索').then(function(j){
    var songs=(j.result&&j.result.songs)||[];
    return songs.map(function(s){
      var ar=(s.ar||s.artists||[]).map(function(a){return a.name}).join(' / ');
      var al=s.al||s.album||{};
      return {
        id:String(s.id),src:'netease',name:s.name,artist:ar,
        album:al.name||'',cover:al.picUrl||'',dur:(s.dt||s.duration||0)/1000,
        mid:(s.fee===1?'vip':'')
      };
    });
  });
}
function searchQQ(kw){
  var h={};
  if(qqBase()===QQ_DEFAULT)h.Authorization='Bearer '+QQ_TOKEN;
  return withTimeout(fetchJSON(qqBase()+'/song/search?k='+encodeURIComponent(kw)+'&n=30',{headers:h}),16000,'QQ 搜索').then(function(j){
    return (j.songs||[]).map(function(x){
      return {id:x.id,src:'qq',name:x.name,artist:x.artist,album:x.album,cover:x.cover,dur:x.dur};
    });
  });
}
function doSearch(){
  var kw=($('#kw').value||'').trim();
  if(!kw){toast('先输入歌名或歌手');return}
  if(S.loading)return;
  S.loading=true;$('#btnSearch').textContent='搜索中';
  var p=S.src==='qq'?searchQQ(kw):searchNcm(kw);
  p.then(function(list){
    S.list=list;
    renderResults(list,kw);
  }).catch(function(e){
    $('#rsMain').innerHTML='<div class="empty">'+esc(e.message||'搜索失败')+'<br><span style="font-size:11px">换个关键词，或晚一点再试</span></div>';
  }).then(function(){
    S.loading=false;$('#btnSearch').textContent='搜索';
  });
}
function renderResults(list,kw){
  if(!list.length){$('#rsMain').innerHTML='<div class="empty">没有找到「'+esc(kw)+'」<br><span style="font-size:11px;color:#5b6375">试试歌手名或更短的歌名</span></div>';return}
  var html='<div class="sect">'+(S.src==='qq'?'QQ 音乐':'网易云音乐')+' · '+list.length+' 首</div><div class="rows">';
  list.forEach(function(s,i){

/* ---------- 播放 ---------- */
var audio=$('#audio');
function songURL(s){
  if(s.src==='qq'){
    var ck=qqCk();
    if(!ck)return Promise.reject(new Error('QQ音乐未登录，先在右上角 Q 登录'));
    return withTimeout(fetchJSON(qqBase()+'/song/urls?id='+encodeURIComponent(s.id)+'&cookie='+encodeURIComponent(ck),{
      headers:{Authorization:'Bearer '+QQ_TOKEN}
    }),15000,'取流').then(function(j){
      if(!j.playable)throw new Error(j.note||'这首歌当前不可播放');
      return j.url;
    });
  }
  var cookie=ncmCk();
  var u=ncmBase()+'/song/url?id='+encodeURIComponent(s.id)+'&br=320000&t='+Date.now()+(cookie?'&cookie='+encodeURIComponent(cookie):'');
  return withTimeout(fetchJSON(u),15000,'取流').then(function(j){
    var d=(j.data||[])[0];
    if(!d||!d.url)throw new Error(cookie?'这首歌没有可播放地址，试试其他歌曲':'这首歌需要登录，先在右上角 云 登录');
    return {url:d.url,br:d.br||0};
  });
}
function playIndex(i){
  var s=S.list[i];if(!s)return;
  S.idx=i;
  showPlaying(s);
  audio.pause();
  songURL(s).then(function(r){
    var url=typeof r==='string'?r:r.url;
    S.br=(typeof r==='object'&&r.br)?r.br:0;
    audio.src=url;
    audio.play().catch(function(){toast('点一下播放键开始播放')});
    updatePlayIcon();
    loadLyric(s);
    loadComments(s,false);
    saveRecent(s);
    renderBadges(s);
  }).catch(function(e){
    toast(e.message||'播放失败');
  });
}
function saveRecent(s){
  var r=[];try{r=JSON.parse(ls(LS.recent,'[]'))}catch(e){r=[]}
  r=r.filter(function(x){return x.id!==s.id});
  r.unshift({id:s.id,src:s.src,name:s.name,artist:s.artist,cover:s.cover,dur:s.dur});
  r=r.slice(0,8);setls(LS.recent,JSON.stringify(r));
  renderRecent();
}
function renderRecent(){
  var r=[];try{r=JSON.parse(ls(LS.recent,'[]'))}catch(e){r=[]}
  if(!r.length){$('#rsRecent').innerHTML='';return}
  var h='<div class="sect">最近播放</div><div class="rows">';
  r.forEach(function(s,i){
    h+='<div class="row" data-r="'+i+'">'+(s.cover?'<img class="cover" src="'+esc(s.cover)+'" alt="">':'<div class="cover"></div>')+
      '<div class="rtxt"><b>'+esc(s.name)+'</b><small>'+esc(s.artist)+' · '+(s.src==='qq'?'QQ 音乐':'网易云')+'</small></div></div>';
  });
  h+='</div>';
  $('#rsRecent').innerHTML=h;
}
$('#rsRecent').addEventListener('click',function(e){
  var row=e.target.closest('[data-r]');if(!row)return;
  var r=[];try{r=JSON.parse(ls(LS.recent,'[]'))}catch(x){r=[]}
  var s=r[parseInt(row.dataset.r,10)];if(!s)return;

  showPlaying(s);
  songURL(s).then(function(v){audio.src=typeof v==='string'?v:v.url;audio.play();updatePlayIcon();loadLyric(s);loadComments(s,false);renderBadges(s)}).catch(function(er){toast(er.message)});
});
function showPlaying(s){

  art.innerHTML=s.cover?'<img src="'+esc(s.cover)+'" alt="" onerror="this.parentNode.innerHTML=\'<div class=&quot;ph&quot;>'+esc((s.name||'F').slice(0,1))+'</div>\'">':'<div class="ph">'+esc((s.name||'F').slice(0,1))+'</div>';

function renderBadges(s){

function updatePlayIcon(){

  $('#npPlay').innerHTML=svg;$('#npPlay2').innerHTML=svg;
  $('#mPlay').textContent=playing?'❚❚':'▶';
}
audio.addEventListener('play',updatePlayIcon);
audio.addEventListener('pause',updatePlayIcon);
audio.addEventListener('ended',function(){if(S.idx>=0&&S.idx+1<S.list.length)playIndex(S.idx+1);else updatePlayIcon()});
audio.addEventListener('timeupdate',function(){
  if(!audio.duration)return;
  var p=audio.currentTime/audio.duration*100;

  $('#tNow').textContent=fmt(audio.currentTime);

});

function setSeek(p){
  p=Math.max(0,Math.min(100,p||0));
  $('#seekFill').style.width=p+'%';
  $('#seekKnob').style.left=p+'%';
}
(function(){
  var seek=$('#seek'),drag=false;
  function pick(e){
    var r=seek.getBoundingClientRect();
    var x=(e.touches?e.touches[0].clientX:e.clientX);
    var p=Math.max(0,Math.min(1,(x-r.left)/r.width));
    if(audio.duration){audio.currentTime=p*audio.duration;setSeek(p*100)}
  }
  seek.addEventListener('pointerdown',function(e){e.preventDefault();drag=true;pick(e);try{seek.setPointerCapture(e.pointerId)}catch(x){}});
  seek.addEventListener('pointermove',function(e){if(drag)pick(e)});
  seek.addEventListener('pointerup',function(){drag=false});
  seek.addEventListener('pointercancel',function(){drag=false});
})();

function setVol(v,byUser){
  v=Math.max(0,Math.min(100,Math.round(v)));
  audio.volume=v/100;
  $('#volFill').style.height=v+'%';
  $('#volKnob').style.bottom=v+'%';

  }
  t.addEventListener('pointerdown',function(e){e.preventDefault();drag=true;pick(e);try{t.setPointerCapture(e.pointerId)}catch(x){}});

})();

/* ---------- 歌词 ---------- */
function loadLyric(s){
  if(S.lyrFor===s.src+':'+s.id)return;
  S.lyrFor=s.src+':'+s.id;
  $('#lyr').innerHTML='<b>正在加载歌词…</b>';
  if(s.src==='qq'){
    jsonp('https://c.y.qq.com/lyric/fcgi-bin/fcg_query_lyric_new.fcg?format=jsonp&songmid='+encodeURIComponent(s.id)+'&g_tk=5381&loginUin=0&hostUin=0&platform=yqq&needNewCode=0').then(function(d){
      var txt=d&&(d.lyric||'');if(!txt)throw new Error('暂无歌词');
      txt=txt.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      renderLyric(parseLRC(txt));
    }).catch(function(){renderLyric([])});
  }else{
    var ck=ncmCk();
    withTimeout(fetchJSON(ncmBase()+'/lyric?id='+encodeURIComponent(s.id)+'&t='+Date.now()+(ck?'&cookie='+encodeURIComponent(ck):'')),12000,'歌词').then(function(j){
      var txt=(j.lrc&&j.lrc.lyric)||'';
      renderLyric(parseLRC(txt));
    }).catch(function(){renderLyric([])});
  }
}
function parseLRC(txt){
  var out=[],re=/\[(\d+):(\d+(?:\.\d+)?)\](.*)/g,m;
  txt=txt||'';
  while((m=re.exec(txt))){var t=parseInt(m[1],10)*60+parseFloat(m[2]);var s=m[3].trim();if(s)out.push({t:t,s:s})}
  var seen={};out=out.filter(function(x){if(seen[x.t+x.s])return false;seen[x.t+x.s]=1;return true});
  out.sort(function(a,b){return a.t-b.t});
  return out;
}
function renderLyric(lines){
  S.lyr=lines;S.lyrIdx=-1;
  if(!lines.length){$('#lyr').innerHTML='<b>暂无歌词</b>';return}
  $('#lyr').innerHTML=lines.map(function(l,i){return '<b data-i="'+i+'">'+esc(l.s)+'</b>'}).join('');
}
function syncLyric(t){
  var lines=S.lyr;if(!lines.length)return;
  var i=-1;for(var k=0;k<lines.length;k++){if(lines[k].t<=t+0.15)i=k;else break}
  if(i<0||i===S.lyrIdx)return;
  S.lyrIdx=i;
  var els=$('#lyr').children;
  for(var j=0;j<els.length;j++)els[j].classList.toggle('on',j===i);
  var el=els[i];if(el&&$('#tabLyr').classList.contains('on')){
    var body=$('#body');body.scrollTo({top:el.offsetTop-body.clientHeight/2+20,behavior:'smooth'});
  }
}

function loadComments(s,force){
  if(!force&&S.cmtFor===s.src+':'+s.id)return;
  S.cmtFor=s.src+':'+s.id;
  var box=$('#cmt');
  box.innerHTML='<div class="cmt-head">评论加载中…</div>';
  $('#cmtCount').textContent='';
  if(s.src==='qq'){
    withTimeout(fetchJSON(qqBase()+'/song/comments?id='+encodeURIComponent(s.id),{headers:{Authorization:'Bearer '+QQ_TOKEN}}),15000,'评论').then(function(j){
      var list=(j.comments||[]).map(function(c){return {name:c.nick,text:c.content,time:(c.time||0)*1000,like:c.praise||0,avatar:c.avatar}});
      renderComments(list,j.total||list.length,'QQ 音乐评论');
    }).catch(function(){box.innerHTML='<div class="cmt-head">这首歌暂时拉不到 QQ 评论</div>'});
  }else{
    var ck=ncmCk();
    withTimeout(fetchJSON(ncmBase()+'/comment/music?id='+encodeURIComponent(s.id)+'&limit=40&t='+Date.now()+(ck?'&cookie='+encodeURIComponent(ck):'')),15000,'评论').then(function(j){
      var raw=[].concat(j.hotComments||[],j.comments||[]);
      var list=raw.map(function(c){return {name:(c.user&&c.user.nickname)||'匿名',text:c.content,time:c.time,like:c.likedCount||0,avatar:(c.user&&c.user.avatarUrl)||''}});
      renderComments(list,j.total||list.length,'网易云音乐评论');
    }).catch(function(){box.innerHTML='<div class="cmt-head">这首歌暂时拉不到网易云评论</div>'});
  }
}
function renderComments(list,total,label){
  var box=$('#cmt');
  if(!list.length){box.innerHTML='<div class="cmt-head">'+esc(label)+'</div><div class="cmt-head">还没有评论</div>';return}
  var h='<div class="cmt-head">'+esc(label)+' · 共 '+total+' 条</div>';
  list.forEach(function(c){
    h+='<div class="cmt-item">'+(c.avatar?'<img src="'+esc(c.avatar)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'<img alt="">')+
      '<div class="cmt-main"><div class="cmt-name">'+esc(c.name)+'<em>'+(c.time?new Date(c.time).toLocaleDateString('zh-CN'):'')+'</em></div>'+
      '<div class="cmt-text">'+esc(c.text)+'</div>'+(c.like?'<div class="cmt-like">♥ '+c.like+'</div>':'')+'</div></div>';
  });
  box.innerHTML=h;
  $('#cmtCount').textContent=total>9999?Math.round(total/10000)+'万':String(total);
}

(function(){
  var np=$('#np'),x0=0,y0=0,t0=0,active=false;
  np.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
    active=!e.target.closest('.seek,.vol-track,.body');
  },{passive:true});
  np.addEventListener('touchend',function(e){

    else if(e.deltaX<0&&S.page===2){S.page=1;$('#np').classList.remove('p2')}

})();

var LOGIN={src:'netease',mode:'qr',key:'',timer:null,busy:false};
function openLogin(src){
  LOGIN.src=src;
  $('#modal').classList.add('open');
  $('#mTitleTxt').textContent=src==='qq'?'QQ音乐扫码登录':'网易云扫码登录';

  $('#mOut').style.display='none';
  $('#qrBox').innerHTML='<span>正在获取二维码…</span>';
  $('#mStatus').textContent='请稍候';

    $('#mOut').style.display='';

    return;
  }
  if(src==='qq')qqGen();else ncmGen();
}
function closeLogin(){

}
$('#mClose').addEventListener('click',closeLogin);
$('#modal').addEventListener('click',function(e){if(e.target===$('#modal'))closeLogin()});

$('#mRefresh').addEventListener('click',function(){if(LOGIN.src==='qq')qqGen();else ncmGen()});
$('#mOut').addEventListener('click',function(){
  if(LOGIN.src==='qq'){setls(LS.qqCk,'');toast('已退出 QQ音乐')}else{setls(LS.ncmCk,'');toast('已退出网易云')}
  closeLogin();markLogin();
});
$('#cfgSave').addEventListener('click',function(){
  var v=($('#cfgInput').value||'').trim();
  if(!v){toast('地址不能为空');return}
  setls(LOGIN.src==='qq'?LS.qq:LS.ncm,v.replace(/\/+$/,''));
  toast('已保存');
  if(LOGIN.src==='qq')qqGen();else ncmGen();
});
function markLogin(){
  $('#btnNcm').classList.toggle('on',!!ncmCk());
  $('#btnQq').classList.toggle('on',!!qqCk());
}
function ncmGen(){
  if(LOGIN.timer){clearInterval(LOGIN.timer);LOGIN.timer=null}
  $('#qrBox').innerHTML='<span>正在获取二维码…</span>';
  $('#mStatus').textContent='请稍候';
  withTimeout(fetchJSON(ncmBase()+'/login/qr/key?t='+Date.now()),12000,'二维码').then(function(j){
    LOGIN.key=j.data.unikey;
    return withTimeout(fetchJSON(ncmBase()+'/login/qr/create?key='+encodeURIComponent(LOGIN.key)+'&qrimg=true&t='+Date.now()),12000,'二维码');
  }).then(function(j){
    var img=(j.data&&j.data.qrimg)||'';
    if(!img)throw new Error('二维码没有生成');
    $('#qrBox').innerHTML='<img src="'+img+'" alt="网易云登录二维码">';
    $('#mStatus').textContent='请用网易云音乐 App 扫码';
    pollNcm();
  }).catch(function(e){
    $('#qrBox').innerHTML='<span>二维码获取失败</span>';
    $('#mStatus').textContent=(e.message||'网络异常')+' · 点重新生成';
  });
}
function pollNcm(){
  var t0=Date.now();
  LOGIN.timer=setInterval(function(){
    if(LOGIN.busy)return;
    if(Date.now()-t0>180000){clearInterval(LOGIN.timer);LOGIN.timer=null;$('#mStatus').textContent='二维码已过期，点重新生成';return}
    LOGIN.busy=true;
    fetchJSON(ncmBase()+'/login/qr/check?key='+encodeURIComponent(LOGIN.key)+'&t='+Date.now()).then(function(j){
      LOGIN.busy=false;
      var c=j.code;
      var sec=Math.round((Date.now()-t0)/1000);
      if(c===800){clearInterval(LOGIN.timer);LOGIN.timer=null;$('#mStatus').textContent='二维码已过期，点重新生成';return}
      if(c===801){$('#mStatus').textContent='等待扫码… '+sec+'s';return}
      if(c===802){$('#mStatus').textContent='已扫码，请在手机上确认…';return}
      if(c===803){
        clearInterval(LOGIN.timer);LOGIN.timer=null;
        var ck=(j.cookie||'').split(';').filter(function(x){return x.indexOf('MUSIC_U=')>-1})[0];
        if(!ck){$('#mStatus').textContent='登录成功但没拿到授权，重新扫码';return}
        setls(LS.ncmCk,ck.trim());
        $('#mStatus').textContent='网易云登录成功';
        markLogin();toast('网易云登录成功');
        setTimeout(closeLogin,1200);
      }
    }).catch(function(){LOGIN.busy=false;$('#mStatus').textContent='接口没响应，稍后重试'});
  },2000);
}
function qqGen(){
  if(LOGIN.timer){clearInterval(LOGIN.timer);LOGIN.timer=null}
  $('#qrBox').innerHTML='<span>正在获取二维码…</span>';
  $('#mStatus').textContent='请稍候';
  var h={};
  if(qqBase()===QQ_DEFAULT)h.Authorization='Bearer '+QQ_TOKEN;
  withTimeout(fetchJSON(qqBase()+'/getQQLoginQr',{headers:h}),15000,'二维码').then(function(j){
    var img=j.img||(j.data&&j.data.img),sig=j.qrsig||(j.data&&j.data.qrsig),tok=j.ptqrtoken||(j.data&&j.data.ptqrtoken);
    if(!img||!sig)throw new Error('二维码没有生成');
    LOGIN.qrsig=sig;LOGIN.ptok=tok;
    LOGIN.tokenHdr=(qqBase()===QQ_DEFAULT)?{Authorization:'Bearer '+QQ_TOKEN}:{};
    $('#qrBox').innerHTML='<img src="'+img+'" alt="QQ 登录二维码">';
    $('#mStatus').textContent='请用 QQ 扫码登录';
    pollQQ();
  }).catch(function(e){
    $('#qrBox').innerHTML='<span>二维码获取失败</span>';
    $('#mStatus').textContent=(e.message||'网络异常')+' · 点重新生成';
  });
}
function pollQQ(){
  var t0=Date.now(),fails=0;
  LOGIN.timer=setInterval(function(){
    if(LOGIN.busy)return;
    var sec=Math.round((Date.now()-t0)/1000);
    if(sec>180){clearInterval(LOGIN.timer);LOGIN.timer=null;$('#mStatus').textContent='二维码已过期，点重新生成';return}
    LOGIN.busy=true;
    fetchJSON(qqBase()+'/checkQQLoginQr',{
      method:'POST',headers:Object.assign({'Content-Type':'application/json'},LOGIN.tokenHdr||{}),
      body:JSON.stringify({qrsig:LOGIN.qrsig,ptqrtoken:String(LOGIN.ptok||'')})
    }).then(function(j){
      LOGIN.busy=false;fails=0;
      if(j.refresh){clearInterval(LOGIN.timer);LOGIN.timer=null;$('#mStatus').textContent='二维码已过期，点重新生成';return}
      if(!j.isOk){$('#mStatus').textContent=(j.scanned?'已扫码，请在手机上确认… ':'等待扫码… ')+sec+'s';return}
      clearInterval(LOGIN.timer);LOGIN.timer=null;
      var sess=j.session||(j.data&&j.data.session),c=sess&&sess.cookie;
      if(!c){$('#mStatus').textContent='登录成功但没拿到授权，重新扫码';return}
      setls(LS.qqCk,c);
      $('#mStatus').textContent='QQ音乐登录成功';
      markLogin();toast('QQ音乐登录成功');
      setTimeout(closeLogin,1200);
    }).catch(function(){
      LOGIN.busy=false;fails++;
      $('#mStatus').textContent=fails>=3?'接口没响应，点重新生成':'网络不稳，重试中…';
      if(fails>=3){clearInterval(LOGIN.timer);LOGIN.timer=null}
    });
  },2500);
}
